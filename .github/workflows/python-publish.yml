name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/pysqlx/

    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version is read from the git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the distributions
        run: uv build

      - name: Check that the version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          ls dist
          test -f "dist/pysqlx-${version}.tar.gz"
          test -f "dist/pysqlx-${version}-py3-none-any.whl"

      - name: Publish to PyPI
        run: uv publish
