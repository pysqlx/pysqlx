name: Tests

on:
  pull_request:
    branches: [master]
    # Only when the change can affect the result of the tests.
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  schedule:
    # Daily on the default branch, which keeps the badge of the README current
    # and finds what changes outside the repository break.
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  # The whole test suite with SQLite, which needs no database server.
  unit:
    name: Unit tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run the tests
        run: uv run --no-sync pytest -n auto --cov --cov-report=term-missing:skip-covered

  # The clients against real servers, which run as containers on Linux only.
  servers-linux:
    name: PostgreSQL, MySQL and SQL Server / Linux

    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway servers, which only exist while the job runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pysqlx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pysqlx_test
          MYSQL_DATABASE: pysqlx
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppysqlx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Pysqlx_test_1
        ports:
          - 1433:1433

    env:
      PYSQLX_TEST_POSTGRESQL: postgres:pysqlx_test@127.0.0.1:5432/postgres
      PYSQLX_TEST_MYSQL: root:pysqlx_test@127.0.0.1:3306/pysqlx
      PYSQLX_TEST_MSSQL: sa:Pysqlx_test_1@127.0.0.1:1433/master
      # Fail, instead of skipping, when a server cannot be used.
      PYSQLX_TEST_REQUIRE_SERVERS: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the ODBC driver for SQL Server
        run: |
          if odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            exit 0
          fi

          install() {
            sudo apt-get update && sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          }

          # The runner usually knows the package source of Microsoft already.
          if ! install; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc |
              sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" |
              sudo tee /etc/apt/sources.list.d/mssql-release.list
            install
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Wait for SQL Server
        run: |
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              break
            fi
            sleep 2
          done
          sleep 15

      - name: Run the tests
        run: uv run --no-sync pytest tests/clients

  # The ODBC client where the servers of servers-linux cannot run.
  sql-server-desktop:
    name: SQL Server / ${{ matrix.os }}

    strategy:
      matrix:
        # SQL Server runs in a container on macOS, which needs an Intel runner.
        os: [windows-latest, macos-15-intel]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    env:
      PYSQLX_TEST_MSSQL: sa:Pysqlx_test_1@127.0.0.1:1433/master
      # Fail, instead of skipping, when the server cannot be used.
      PYSQLX_TEST_REQUIRE_SERVERS: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install SQL Server (Windows)
        if: runner.os == 'Windows'
        # Windows runners already have the ODBC driver.
        uses: potatoqualitee/mssqlsuite@bc850f242e5fe551e36cea6fa4bed608c58fa489 # v2
        with:
          install: sqlengine
          sa-password: Pysqlx_test_1

      - name: Start SQL Server in a container (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install docker colima
          colima start --cpu 2 --memory 4
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=Pysqlx_test_1 \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      - name: Install the ODBC driver for SQL Server (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_ACCEPT_EULA: "Y"
        run: |
          brew tap microsoft/mssql-release https://github.com/Microsoft/homebrew-mssql-release
          brew trust microsoft/mssql-release
          brew install msodbcsql18

      - name: Wait for SQL Server (macOS)
        if: runner.os == 'macOS'
        run: |
          for attempt in $(seq 1 60); do
            if docker logs mssql 2>&1 | grep -q "SQL Server is now ready for client connections"; then
              exit 0
            fi
            sleep 5
          done
          docker logs mssql
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run the tests
        run: uv run --no-sync pytest tests/clients/test_pyodbc.py
