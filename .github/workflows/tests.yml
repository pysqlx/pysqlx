name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run the tests
        run: uv run --no-sync pytest -n auto --cov --cov-report=term-missing:skip-covered

  servers:
    name: Database servers

    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway servers, which only exist while the job runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pysqlx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pysqlx_test
          MYSQL_DATABASE: pysqlx
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppysqlx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Pysqlx_test_1
        ports:
          - 1433:1433

    env:
      PYSQLX_TEST_POSTGRESQL: postgres:pysqlx_test@127.0.0.1:5432/postgres
      PYSQLX_TEST_MYSQL: root:pysqlx_test@127.0.0.1:3306/pysqlx
      PYSQLX_TEST_MSSQL: sa:Pysqlx_test_1@127.0.0.1:1433/master
      # Fail, instead of skipping, when a server cannot be used.
      PYSQLX_TEST_REQUIRE_SERVERS: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the ODBC driver for SQL Server
        run: |
          if odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            exit 0
          fi

          install() {
            sudo apt-get update && sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          }

          # The runner usually knows the package source of Microsoft already.
          if ! install; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc |
              sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" |
              sudo tee /etc/apt/sources.list.d/mssql-release.list
            install
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Wait for SQL Server
        run: |
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              break
            fi
            sleep 2
          done
          sleep 15

      - name: Run the tests
        run: uv run --no-sync pytest tests/clients
