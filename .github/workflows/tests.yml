name: Tests

on:
  pull_request:
    branches: [master]
  schedule:
    # Daily on the default branch, which keeps the badge of the README current
    # and finds what changes outside the repository break.
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run of the previous one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The make targets run in the environment which install-test prepared.
  UV_NO_SYNC: "1"

defaults:
  run:
    # The same shell on every system, which make needs on Windows.
    shell: bash

jobs:
  # The whole test suite with SQLite, which needs no database server.
  unit:
    name: Unit tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # macOS runners are scarce: test the oldest and the newest version there.
        exclude:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: make install-test

      - name: Run the tests
        run: make coverage

  # The clients against real servers, which run as containers on Linux only.
  servers-linux:
    name: PostgreSQL, MySQL and SQL Server / Linux

    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway servers, which only exist while the job runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pysqlx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pysqlx_test
          MYSQL_DATABASE: pysqlx
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppysqlx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Pysqlx_test_1
        ports:
          - 1433:1433

    env:
      PYSQLX_TEST_POSTGRESQL: postgres:pysqlx_test@127.0.0.1:5432/postgres
      PYSQLX_TEST_MYSQL: root:pysqlx_test@127.0.0.1:3306/pysqlx
      PYSQLX_TEST_MSSQL: sa:Pysqlx_test_1@127.0.0.1:1433/master
      # Fail, instead of skipping, when a server cannot be used.
      PYSQLX_TEST_REQUIRE_SERVERS: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install the ODBC driver for SQL Server
        run: make odbc-driver

      - name: Install dependencies
        run: make install-test

      - name: Wait for SQL Server
        run: make sql-server-wait

      - name: Run the tests
        run: make test-clients

  # The ODBC client where the servers of servers-linux cannot run.
  sql-server-desktop:
    name: SQL Server / ${{ matrix.os }}

    strategy:
      matrix:
        # SQL Server runs in a container on macOS, which needs an Intel runner.
        os: [windows-latest, macos-15-intel]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    env:
      PYSQLX_TEST_MSSQL: sa:Pysqlx_test_1@127.0.0.1:1433/master
      # Fail, instead of skipping, when the server cannot be used.
      PYSQLX_TEST_REQUIRE_SERVERS: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install SQL Server (Windows)
        if: runner.os == 'Windows'
        # Windows runners already have the ODBC driver.
        uses: potatoqualitee/mssqlsuite@bc850f242e5fe551e36cea6fa4bed608c58fa489 # v2
        with:
          install: sqlengine
          sa-password: Pysqlx_test_1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Start SQL Server in a container (macOS)
        if: runner.os == 'macOS'
        run: make sql-server-up

      - name: Install the ODBC driver for SQL Server
        run: make odbc-driver

      - name: Install dependencies
        run: make install-test

      - name: Wait for SQL Server
        run: make sql-server-wait

      - name: Run the tests
        run: make test-sql-server
