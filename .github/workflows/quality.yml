name: Quality

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run ruff
        run: make lint

      - name: Run mypy
        run: make typecheck

      - name: Build the documentation
        run: make docs
