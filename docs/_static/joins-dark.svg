<text x="95" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e5e7eb" text-anchor="middle" xml:space="preserve">kind=&quot;inner&quot;</text>
<text x="95" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle" xml:space="preserve">rows with a match</text>
